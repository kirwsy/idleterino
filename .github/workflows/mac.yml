name: Build macOS
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag do release a publicar (vazio = só gera)
        default: ''
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash scripts/build-mac.sh --arm64 --x64
      - name: Abrir o app por 45 s
        run: |
          export IDLETERINO_DATA="$RUNNER_TEMP/dados"
          mkdir -p "$IDLETERINO_DATA" teste
          dist/mac-arm64/Idleterino.app/Contents/MacOS/Idleterino > teste/log.txt 2>&1 &
          PID=$!
          sleep 45
          screencapture -x teste/tela.png || true
          cat teste/log.txt
          ls "$IDLETERINO_DATA"
          ps -axo command | grep "[I]dleterino Helper" | grep -c "type=renderer" || true
          kill -0 "$PID"
          test -f "$IDLETERINO_DATA/idleterino.json"
          osascript -e 'tell application "System Events" to get name of every process whose visible is true' || true
          kill "$PID"
          sleep 8
          if kill -0 "$PID" 2>/dev/null; then echo "Nao encerrou"; kill -9 "$PID"; exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: teste
          path: teste
      - uses: actions/upload-artifact@v7
        with:
          name: Idleterino-mac
          path: dist/*.dmg
          if-no-files-found: error
  release:
    needs: mac
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: Idleterino-mac
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          (cd dist && sha256sum *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "$TAG" dist/*.dmg dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Idleterino para Mac $TAG" --notes-file scripts/notas-release-mac.md --latest
