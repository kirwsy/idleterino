name: Build macOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/build-mac.sh --arm64 --x64
      - uses: actions/upload-artifact@v4
        with:
          name: Idleterino-mac
          path: dist/*.dmg
          if-no-files-found: error
